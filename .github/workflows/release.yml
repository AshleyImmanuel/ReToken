name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        
      - name: Build CLI
        run: cargo build --release -p cli
        
      - name: Rename binary
        run: move target\release\cli.exe retoken-windows-amd64.exe
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: retoken-windows-amd64.exe
          generate_release_notes: true
