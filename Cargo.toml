[workspace]
members = [
    "core",
    "analyzers",
    "retrieval",
    "scheduler",
    "gateway",
    "proxy",
    "cli"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
