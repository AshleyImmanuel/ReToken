[workspace]
members = [
    "core",
    "analyzers",
    "retrieval",
    "scheduler",
    "gateway",
    "cli",
    "mcp",
    "compressors",
]
resolver = "2"

[workspace.package]
version = "1.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/AshleyImmanuel/ReToken"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
# Rewritten requests must match what the client sent:
# preserve_order keeps key order (stable rendering and caching);
# arbitrary_precision keeps numbers exact (no f64 rounding of large integers or long decimals).
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
futures-util = "0.3"
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
