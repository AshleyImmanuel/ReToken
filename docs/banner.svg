<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Decorative Subtle Glows -->
  <circle cx="200" cy="200" r="180" fill="url(#accent)" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="200" r="220" fill="url(#accent)" opacity="0.05" filter="url(#glow)"/>

  <!-- Logo/Icon (Abstract Proxy/Speed/Token Icon) -->
  <g transform="translate(150, 140)">
    <!-- Hexagon Base -->
    <path d="M 60 0 L 120 34.6 L 120 103.9 L 60 138.5 L 0 103.9 L 0 34.6 Z" fill="none" stroke="url(#accent)" stroke-width="8"/>
    <!-- Inner fast-forward/proxy arrows -->
    <path d="M 40 45 L 75 69.2 L 40 93.4" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 65 45 L 100 69.2 L 65 93.4" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  </g>

  <!-- Text -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="330" y="215" font-size="96" font-weight="800" fill="#c9d1d9" letter-spacing="1.5">ReToken</text>
    <text x="335" y="265" font-size="22" font-weight="500" fill="#8b949e" letter-spacing="2">ZERO-LATENCY LOCAL PROXY FOR AGENTIC WORKFLOWS</text>
  </g>
  
  <!-- Network Nodes Graphic on Right -->
  <g transform="translate(850, 120)" stroke="rgba(255,255,255,0.1)" stroke-width="2">
    <!-- Connecting lines -->
    <line x1="40" y1="80" x2="120" y2="40"/>
    <line x1="40" y1="80" x2="120" y2="120"/>
    <line x1="120" y1="40" x2="200" y2="80"/>
    <line x1="120" y1="120" x2="200" y2="80"/>
    <line x1="120" y1="40" x2="120" y2="120"/>
    <line x1="-40" y1="80" x2="40" y2="80"/>
    
    <!-- Data packets (animated/colored) -->
    <circle cx="0" cy="80" r="4" fill="#58a6ff" stroke="none"/>
    <circle cx="80" cy="60" r="4" fill="#8957e5" stroke="none"/>
    <circle cx="160" cy="100" r="4" fill="#58a6ff" stroke="none"/>

    <!-- Nodes -->
    <circle cx="-40" cy="80" r="8" fill="#161b22" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="40" cy="80" r="10" fill="#161b22" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="120" cy="40" r="8" fill="#161b22" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="120" cy="120" r="8" fill="#161b22" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="200" cy="80" r="10" fill="#161b22" stroke="url(#accent)" stroke-width="3"/>
  </g>
</svg>
